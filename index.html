      @import url('https://fonts.googleapis.com/css2?family=New+York:wght@400;500;600;700&family=SF+Pro+Display:wght@400;500;600;700&display=swap');
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none; /* Prevent bounce on Mac */
      }

      .font-serif-apple {
        font-family: "New York", "Times New Roman", Times, serif;
      }

      /* Hide scrollbar for clean UI but allow scrolling */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Range slider styling for that iOS look */
      input[type=range] {
        -webkit-appearance: none; 
        background: transparent; 
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
      }
      input[type=range]:focus {
        outline: none; 
      }
    </style>
